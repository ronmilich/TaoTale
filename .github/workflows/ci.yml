name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm check:ui && pnpm check:ui:test
      - run: pnpm format:check && pnpm lint && pnpm typecheck
      - run: pnpm test --run && pnpm build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sh ../scripts/check-go.sh
      - run: go mod verify && go vet ./... && go test ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
      - run: go test -race ./...

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/sqlc.sh diff
      - run: bash scripts/test-db.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sh scripts/check-secrets.sh

  future-gates:
    name: "Placeholder / ${{ matrix.gate }}"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        gate: [browser E2E with mock TTS]
    steps:
      - run: echo 'Placeholder. See docs/12-taotale-quality-and-acceptance.md.'
