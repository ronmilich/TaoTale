name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm check:ui && pnpm check:ui:test
      - run: pnpm format:check && pnpm lint && pnpm typecheck
      - run: pnpm test --run && pnpm build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sh ../scripts/check-go.sh
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go mod verify && go vet ./... && go test ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
      - run: go test -race ./...

  azure-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 --target speech-worker -f backend/Dockerfile .

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/sqlc.sh diff
      - run: bash scripts/test-db.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sh scripts/check-secrets.sh

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@11.25.0
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - working-directory: infra
        run: |
          printf 'POSTGRES_PASSWORD=%s\nPORT=18080\nTAOTALE_BACKEND_TARGET=mock-runtime\n' "$(openssl rand -hex 24)" > .env
          docker compose up --build --wait --wait-timeout 120
          curl --fail --silent --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 http://127.0.0.1:18080/health/ready
      - working-directory: frontend
        run: pnpm test:e2e
      - if: always()
        working-directory: infra
        run: |
          if [ -f .env ]; then docker compose down; fi
