openapi: 3.1.0
info:
  title: TaoTale backend
  version: 0.1.0
servers:
  - url: /api/v1
  - url: /
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/APIError'
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          description: PostgreSQL or the media directory is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Backend storage unavailable.
                  requestId: example-request-id
        default:
          $ref: '#/components/responses/APIError'
components:
  headers:
    RequestId:
      description: Server-generated identifier for this request.
      required: true
      schema:
        type: string
  responses:
    Healthy:
      description: The health check passed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: {const: ok}
    APIError:
      description: A sanitized HTTP error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
            details:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [path, code, message]
                    properties:
                      path: {type: string}
                      code: {type: string}
                      message: {type: string}
