openapi: 3.1.0
info:
  title: TaoTale backend
  version: 0.1.0
  description: Loopback-only JSON API for the local TaoTale application.
servers:
  - url: /api/v1
paths:
  /health/live:
    servers:
      - url: /api/v1
      - url: /
    get:
      operationId: healthLive
      summary: Check whether the API process is running
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
  /health/ready:
    servers:
      - url: /api/v1
      - url: /
    get:
      operationId: healthReady
      summary: Check whether the API can use its local storage
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          description: PostgreSQL is unreachable, its migration history is incompatible, or the media directory is unwritable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Backend storage unavailable.
                  requestId: example-request-id
  /languages:
    get:
      operationId: listLanguages
      summary: List enabled learning languages
      responses:
        '200':
          description: Enabled, supported languages in locale-code order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageList'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items:
    get:
      operationId: listItems
      summary: List the owner's items for one learning language
      parameters:
        - $ref: '#/components/parameters/ItemLanguage'
        - name: q
          in: query
          description: Literal case-insensitive title substring.
          schema: {type: string, maxLength: 120}
        - name: status
          in: query
          schema: {type: string, enum: [all, draft, published], default: all}
        - name: difficulty
          in: query
          schema: {type: string, enum: [unspecified, beginner, intermediate, advanced]}
        - name: favoritesOnly
          in: query
          schema: {type: boolean, default: false}
        - name: topics
          in: query
          description: Match any of the listed topic IDs.
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, format: uuid}
        - name: sort
          in: query
          schema: {type: string, enum: [newest, oldest, title_asc, title_desc], default: newest}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 2147483647, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 8}
      responses:
        '200':
          $ref: '#/components/responses/ItemPage'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
    post:
      operationId: createItem
      summary: Save a new draft and optionally claim a matching preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          $ref: '#/components/responses/Item'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /items/publish:
    post:
      operationId: publishPreview
      summary: Publish a new item by claiming its matching READY preview
      description: The item, preview claim and publication receipt commit together. Replay the same key and intent to recover the original result for 24 hours.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectPublication'
      responses:
        '201':
          $ref: '#/components/responses/Publication'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/publish:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: publishDraft
      summary: Publish the expected draft version with its latest verified recording
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
                audioAssetId:
                  type: string
                  format: uuid
                  description: If supplied, the latest eligible recording must also match this pin.
      responses:
        '200':
          $ref: '#/components/responses/Publication'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getItem
      summary: Read a saved item
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
    patch:
      operationId: patchItem
      summary: Update an item at the expected version and optionally claim a matching preview for a draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
    delete:
      operationId: deleteItem
      summary: Delete an owned item and release unreferenced media
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/favorite:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    put:
      operationId: setItemFavorite
      summary: Set an item's favorite flag independently of its content version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isFavorite]
              properties:
                isFavorite: {type: boolean}
      responses:
        '200':
          description: Confirmed favorite
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, isFavorite]
                properties:
                  id: {type: string, format: uuid}
                  isFavorite: {type: boolean}
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/AudioAssetPin'
    get:
      operationId: streamItemAudio
      summary: Stream the requested current item recording
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioStream'
        '206':
          $ref: '#/components/responses/PartialAudioStream'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio/download:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/AudioAssetPin'
    get:
      operationId: downloadItemAudio
      summary: Download the requested current item recording
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioDownload'
        '206':
          $ref: '#/components/responses/PartialAudioDownload'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: openRevision
      summary: Open or resume the working revision
      responses:
        '200': {$ref: '#/components/responses/WorkingRevision'}
        '201': {$ref: '#/components/responses/WorkingRevision'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /items/{itemId}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/RevisionId'
    get:
      operationId: getRevision
      summary: Read the saved revision and its latest candidate status
      responses:
        '200': {$ref: '#/components/responses/WorkingRevision'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
    patch:
      operationId: patchRevision
      summary: Save revision speech inputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
                sourceText: {type: string, maxLength: 1500, description: Exact source of up to 1500 UTF-16 units.}
                voiceId: {type: [string, 'null']}
                speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
      responses:
        '200': {$ref: '#/components/responses/WorkingRevision'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
    delete:
      operationId: discardRevision
      summary: Discard the saved revision and its candidate recordings
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 2147483647}
      responses:
        '204': {$ref: '#/components/responses/Deleted'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /items/{itemId}/revisions/{revisionId}/audio/generate:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/RevisionId'
    post:
      operationId: generateRevisionAudio
      summary: Generate audio for the saved revision version
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
      responses:
        '202': {$ref: '#/components/responses/GenerationReceipt'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '429': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /items/{itemId}/revisions/{revisionId}/audio:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/RevisionId'
      - $ref: '#/components/parameters/AudioAssetPin'
      - $ref: '#/components/parameters/AudioRange'
    get:
      operationId: streamRevisionAudio
      summary: Stream the pinned revision candidate
      responses:
        '200': {$ref: '#/components/responses/AudioStream'}
        '206': {$ref: '#/components/responses/PartialAudioStream'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '416': {$ref: '#/components/responses/InvalidAudioRange'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /items/{itemId}/revisions/{revisionId}/audio/download:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/RevisionId'
      - $ref: '#/components/parameters/AudioAssetPin'
      - $ref: '#/components/parameters/AudioRange'
    get:
      operationId: downloadRevisionAudio
      summary: Download the pinned revision candidate
      responses:
        '200': {$ref: '#/components/responses/AudioDownload'}
        '206': {$ref: '#/components/responses/PartialAudioDownload'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '416': {$ref: '#/components/responses/InvalidAudioRange'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /items/{itemId}/revisions/{revisionId}/publish:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/RevisionId'
    post:
      operationId: publishRevision
      summary: Publish the verified candidate against the current item version and base recording
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, expectedItemVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
                expectedItemVersion: {type: integer, minimum: 1, maximum: 2147483647}
                audioAssetId: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/Publication'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /items/{itemId}/vocabulary:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      operationId: getItemVocabulary
      summary: List vocabulary linked to an item
      responses:
        '200':
          description: Vocabulary, reference provenance and verified text annotations for this item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemVocabulary'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /items/{itemId}/vocabulary/sync:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: syncItemVocabulary
      summary: Reconcile exact vocabulary matches for one published Mandarin item
      responses:
        '200':
          description: Number of distinct vocabulary entries found in the exact published text.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [matched]
                properties:
                  matched: {type: integer, minimum: 0}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '422':
          description: VOCABULARY_MATCHING_UNSUPPORTED for an item language without a verified strategy.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /vocabulary:
    get:
      operationId: listVocabulary
      summary: Browse vocabulary in one learning language
      parameters:
        - $ref: '#/components/parameters/VocabularyLanguage'
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
          description: Literal case-insensitive search in word, reading and meaning.
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/VocabularyStatus'}
        - name: topics
          in: query
          style: form
          explode: false
          description: Match any of these Topics.
          schema: {$ref: '#/components/schemas/VocabularyTopicIds'}
        - name: sort
          in: query
          schema: {type: string, enum: [newest, oldest, word_asc, word_desc], default: newest}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 2147483647, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, const: 10, default: 10}
      responses:
        '200':
          description: One vocabulary page and the filtered total.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyPage'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
    post:
      operationId: createVocabulary
      summary: Create a word and optionally link its source item in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VocabularyCreate'}
      responses:
        '201':
          description: The new vocabulary entry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyDetail'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /vocabulary/lookup:
    get:
      operationId: lookupVocabulary
      summary: Look up the normalized word in one learning language
      parameters:
        - $ref: '#/components/parameters/VocabularyLanguage'
        - name: word
          in: query
          required: true
          schema: {type: string, minLength: 1}
          description: Up to 120 Unicode code points after outer trim.
      responses:
        '200':
          description: The matched entry or null when the word has not been collected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyLookup'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /vocabulary/stats:
    get:
      operationId: getVocabularyStats
      summary: Count entries and distinct referenced items in one learning language
      parameters:
        - $ref: '#/components/parameters/VocabularyLanguage'
      responses:
        '200':
          description: Vocabulary totals scoped to the requested language.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyStats'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /vocabulary/bulk:
    post:
      operationId: bulkVocabulary
      summary: Change status or delete the entire selection atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VocabularyBulk'}
      responses:
        '200':
          description: The number of entries affected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyBulkResult'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /vocabulary/{vocabularyId}:
    parameters:
      - $ref: '#/components/parameters/VocabularyId'
    get:
      operationId: getVocabulary
      summary: Get a vocabulary entry with item references
      responses:
        '200':
          description: The entry and its item references.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyDetail'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
    patch:
      operationId: patchVocabulary
      summary: Update vocabulary spelling, metadata, status or Topics
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VocabularyPatch'}
      responses:
        '200':
          description: The updated entry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyDetail'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '409': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
    delete:
      operationId: deleteVocabulary
      summary: Delete the vocabulary entry and its associations
      responses:
        '204': {$ref: '#/components/responses/Deleted'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /vocabulary/{vocabularyId}/references:
    parameters:
      - $ref: '#/components/parameters/VocabularyId'
    post:
      operationId: linkVocabularyReference
      summary: Manually link an item of the same language
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VocabularyLink'}
      responses:
        '200':
          description: The reference including its provenance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VocabularyReference'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /vocabulary/{vocabularyId}/references/{itemId}:
    parameters:
      - $ref: '#/components/parameters/VocabularyId'
      - $ref: '#/components/parameters/ItemId'
    delete:
      operationId: unlinkVocabularyReference
      summary: Remove the association with this item
      responses:
        '204': {$ref: '#/components/responses/Deleted'}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /tts/previews:
    post:
      operationId: createTTSPreview
      summary: Admit a temporary speech preview
      description: The exact synthesis inputs are snapshotted for 24 hours. The same key and inputs replay the original receipt. Expired keys remain reserved.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewInput'
      responses:
        '202':
          description: Durable preview generation receipt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [generationId]
                properties:
                  generationId: {type: string, format: uuid}
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /tts/previews/{generationId}:
    parameters:
      - $ref: '#/components/parameters/PreviewId'
    get:
      operationId: getTTSPreview
      summary: Read the status of an unclaimed temporary preview
      responses:
        '200':
          description: Preview status and playable asset identity when ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewStatus'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/MissingPreview'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /tts/previews/{generationId}/audio:
    parameters:
      - $ref: '#/components/parameters/PreviewId'
    get:
      operationId: streamTTSPreview
      summary: Stream an unclaimed ready preview
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioStream'
        '206':
          $ref: '#/components/responses/PartialAudioStream'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/MissingPreview'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /tts/previews/{generationId}/audio/download:
    parameters:
      - $ref: '#/components/parameters/PreviewId'
    get:
      operationId: downloadTTSPreview
      summary: Download an unclaimed ready preview
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioDownload'
        '206':
          $ref: '#/components/responses/PartialAudioDownload'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/MissingPreview'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio/generate:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: generateDraftAudio
      summary: Admit one generation of the saved draft
      description: A retry with the same key and body returns the original generation for 24 hours, including after edits. An expected version protects new requests from concurrent edits. Expired keys remain reserved. A different active job on this draft conflicts.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
      responses:
        '202':
          $ref: '#/components/responses/GenerationReceipt'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio/generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: generationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getDraftGeneration
      summary: Read a saved generation and its current eligibility for this draft
      responses:
        '200':
          description: Generation status projected against the current saved synthesis inputs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [generationId, itemId, status, jobStatus, sourceFingerprint, audioAssetId, errorCode]
                additionalProperties: false
                properties:
                  generationId: {type: string, format: uuid}
                  itemId: {type: string, format: uuid}
                  status: {type: string, enum: [PENDING, PROCESSING, READY, FAILED, OUTDATED]}
                  jobStatus:
                    description: Persisted job lifecycle for polling. Use status and audioAssetId for playback eligibility.
                    type: string
                    enum: [PENDING, PROCESSING, READY, FAILED]
                  sourceFingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
                  audioAssetId: {type: [string, 'null'], format: uuid}
                  errorCode: {type: [string, 'null']}
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /storage/images:
    post:
      operationId: uploadCoverImage
      summary: Upload validated cover bytes and return an expiring image reference
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: Uploaded cover metadata
          content:
            application/json:
              schema:
                type: object
                required: [id, contentType, sizeBytes, width, height, expiresAt]
                properties:
                  id: {type: string, format: uuid}
                  contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
                  sizeBytes: {type: integer, minimum: 1, maximum: 1000000}
                  width: {type: integer, minimum: 1, maximum: 4096}
                  height: {type: integer, minimum: 1, maximum: 4096}
                  expiresAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/APIError'}
        '403': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '415': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
        '504': {$ref: '#/components/responses/APIError'}
  /storage/images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getCoverImage
      summary: Stream an owned cover image
      responses:
        '200':
          description: Original image bytes
          headers:
            ETag: {schema: {type: string}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '304':
          description: The requested cover matches a cached representation
          headers:
            ETag: {schema: {type: string}}
        '403': {$ref: '#/components/responses/APIError'}
        '404': {$ref: '#/components/responses/APIError'}
        '413': {$ref: '#/components/responses/APIError'}
        '500': {$ref: '#/components/responses/APIError'}
        '503': {$ref: '#/components/responses/APIError'}
  /topics:
    get:
      operationId: listTopics
      summary: List the local owner's Topics
      responses:
        '200':
          description: Shared Topics in normalized name order, with ID as the tie-breaker.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
    post:
      operationId: createTopic
      summary: Create a Topic shared across the owner's learning languages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreate'
      responses:
        '201':
          $ref: '#/components/responses/Topic'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /topics/{topicId}:
    parameters:
      - name: topicId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: patchTopic
      summary: Rename or recolor an owned Topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicPatch'
      responses:
        '200':
          $ref: '#/components/responses/Topic'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
    delete:
      operationId: deleteTopic
      summary: Delete a custom Topic and its associations
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /tts/voices:
    get:
      operationId: listTTSVoices
      summary: List available speech voices for a learning language
      parameters:
        - name: languageCode
          in: query
          required: true
          schema:
            type: string
            enum: [zh-CN, ko-KR]
      responses:
        '200':
          description: Verified voices and supported rates for the selected language.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSVoiceList'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          description: The speech provider is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: TTS_UNAVAILABLE
                  message: Speech synthesis is unavailable.
                  requestId: example-request-id
components:
  parameters:
    VocabularyId:
      name: vocabularyId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VocabularyLanguage:
      name: languageCode
      in: query
      required: true
      schema: {$ref: '#/components/schemas/VocabularyLanguage'}
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AudioAssetPin:
      name: audioAssetId
      in: query
      required: true
      description: Expected asset identity. A stale or unknown recording returns 404.
      schema: {type: string, format: uuid}
    PreviewId:
      name: generationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AudioRange:
      name: Range
      in: header
      description: A single byte range, including open-ended and suffix ranges.
      schema: {type: string}
    ItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemLanguage:
      name: languageCode
      in: query
      required: true
      schema: {type: string, enum: [zh-CN, ko-KR]}
  headers:
    AcceptAudioRanges:
      schema: {type: string, const: bytes}
    PrivateAudioCache:
      schema: {type: string, enum: ['private, no-cache', 'private, no-store']}
    AudioContentRange:
      schema: {type: string}
    RequestId:
      description: Server-generated identifier for this request.
      required: true
      schema:
        type: string
  responses:
    GenerationReceipt:
      description: Durable generation receipt, identical on replay.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            required: [generationId]
            additionalProperties: false
            properties:
              generationId: {type: string, format: uuid}
    WorkingRevision:
      description: Saved working revision with its current candidate status.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkingRevision'
    Publication:
      description: Published item address.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [itemId]
            properties:
              itemId: {type: string, format: uuid}
    AudioStream:
      description: Full verified MP3.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    AudioDownload:
      description: Full verified MP3 served as an attachment.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
        Content-Disposition:
          description: Attachment with a server-generated MP3 filename.
          schema: {type: string}
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    PartialAudioStream:
      description: One satisfiable byte range.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
        Content-Range:
          $ref: '#/components/headers/AudioContentRange'
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    PartialAudioDownload:
      description: One satisfiable byte range served as an attachment.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
        Content-Range:
          $ref: '#/components/headers/AudioContentRange'
        Content-Disposition:
          description: Attachment with a server-generated MP3 filename.
          schema: {type: string}
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    InvalidAudioRange:
      description: INVALID_RANGE for a malformed, multiple or unsatisfiable byte range.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Content-Range:
          $ref: '#/components/headers/AudioContentRange'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MissingPreview:
      description: PREVIEW_NOT_FOUND for an unknown, expired or already claimed preview.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Item:
      description: Saved Library item.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'
    ItemPage:
      description: A page of matching Library items.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ItemPage'
    Topic:
      description: Saved Topic and its item usage count.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Topic'
    Deleted:
      description: The resource was deleted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Healthy:
      description: The health check passed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            required: [status]
            additionalProperties: false
            properties:
              status: {const: ok}
    APIError:
      description: A sanitized HTTP error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    VocabularyLanguage:
      type: string
      enum: [zh-CN, ko-KR]
    VocabularyStatus:
      type: string
      enum: [LEARNING, ACQUIRED]
    VocabularyTopicIds:
      type: array
      maxItems: 10
      uniqueItems: true
      items: {type: string, format: uuid}
    VocabularyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        word: {type: string, minLength: 1, description: Up to 120 Unicode code points after outer trim.}
        reading: {type: [string, 'null'], maxLength: 160}
        readingSystem: {type: [string, 'null'], maxLength: 40}
        meaning: {type: [string, 'null'], maxLength: 300}
        note: {type: [string, 'null'], maxLength: 5000}
        status: {$ref: '#/components/schemas/VocabularyStatus'}
        topicIds: {$ref: '#/components/schemas/VocabularyTopicIds'}
    VocabularyCreate:
      type: object
      additionalProperties: false
      required: [languageCode, word]
      properties:
        languageCode: {$ref: '#/components/schemas/VocabularyLanguage'}
        word: {type: string, minLength: 1, description: Up to 120 Unicode code points after outer trim.}
        reading: {type: [string, 'null'], maxLength: 160}
        readingSystem: {type: [string, 'null'], maxLength: 40}
        meaning: {type: [string, 'null'], maxLength: 300}
        note: {type: [string, 'null'], maxLength: 5000}
        status: {$ref: '#/components/schemas/VocabularyStatus'}
        topicIds: {$ref: '#/components/schemas/VocabularyTopicIds'}
        itemId: {type: string, format: uuid}
    VocabularyEntry:
      type: object
      required: [id, languageCode, word, reading, readingSystem, meaning, note, status, topicIds, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        languageCode: {$ref: '#/components/schemas/VocabularyLanguage'}
        word: {type: string, minLength: 1, maxLength: 120}
        reading: {type: [string, 'null'], maxLength: 160}
        readingSystem: {type: [string, 'null'], maxLength: 40}
        meaning: {type: [string, 'null'], maxLength: 300}
        note: {type: [string, 'null'], maxLength: 5000}
        status: {$ref: '#/components/schemas/VocabularyStatus'}
        topicIds: {$ref: '#/components/schemas/VocabularyTopicIds'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    VocabularyReference:
      type: object
      required: [itemId, addedAt, manualLinked, autoLinked]
      properties:
        itemId: {type: string, format: uuid}
        addedAt: {type: string, format: date-time}
        manualLinked: {type: boolean}
        autoLinked: {type: boolean}
    VocabularyReferenceDetail:
      allOf:
        - {$ref: '#/components/schemas/VocabularyReference'}
        - type: object
          required: [title]
          properties:
            title: {type: [string, 'null']}
    VocabularyDetail:
      allOf:
        - {$ref: '#/components/schemas/VocabularyEntry'}
        - type: object
          required: [references]
          properties:
            references:
              type: array
              items: {$ref: '#/components/schemas/VocabularyReferenceDetail'}
    ItemVocabulary:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        sourceText:
          type: string
          description: Exact published text that the annotation ranges apply to, omitted for unsupported languages.
        annotations:
          type: array
          description: Non-overlapping ranges in source order, present when matching is enabled for the item.
          items:
            $ref: '#/components/schemas/VocabularyAnnotation'
        items:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/VocabularyEntry'}
              - type: object
                required: [reference]
                properties:
                  reference: {$ref: '#/components/schemas/VocabularyReference'}
    VocabularyAnnotation:
      type: object
      additionalProperties: false
      required: [vocabularyId, start, end]
      properties:
        vocabularyId: {type: string, format: uuid}
        start: {type: integer, minimum: 0, description: Inclusive UTF-16 offset.}
        end: {type: integer, minimum: 1, description: Exclusive UTF-16 offset.}
    VocabularyLink:
      type: object
      additionalProperties: false
      required: [itemId]
      properties:
        itemId: {type: string, format: uuid}
    VocabularyLookup:
      type: object
      additionalProperties: false
      required: [entry]
      properties:
        entry:
          anyOf:
            - {$ref: '#/components/schemas/VocabularyEntry'}
            - {type: 'null'}
    VocabularyPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/VocabularyEntry'}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, const: 10}
    VocabularyStats:
      type: object
      additionalProperties: false
      required: [languageCode, total, learning, acquired, referencedTexts]
      properties:
        languageCode: {$ref: '#/components/schemas/VocabularyLanguage'}
        total: {type: integer, minimum: 0}
        learning: {type: integer, minimum: 0}
        acquired: {type: integer, minimum: 0}
        referencedTexts: {type: integer, minimum: 0}
    VocabularyBulk:
      type: object
      additionalProperties: false
      required: [languageCode, action, ids]
      properties:
        languageCode: {$ref: '#/components/schemas/VocabularyLanguage'}
        action: {type: string, enum: [setStatus, delete]}
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/VocabularyStatus'
          description: Required for setStatus and omitted for delete.
    VocabularyBulkResult:
      type: object
      additionalProperties: false
      required: [affected]
      properties:
        affected: {type: integer, minimum: 1, maximum: 100}
    WorkingRevision:
      type: object
      additionalProperties: false
      required: [id, itemId, baseAudioAssetId, version, itemVersion, languageCode, sourceText, voiceId, speakingRate, audioStatus, audioGenerationId, audioAssetId, errorCode, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        itemId: {type: string, format: uuid}
        baseAudioAssetId: {type: string, format: uuid}
        version: {type: integer, minimum: 1, maximum: 2147483647}
        itemVersion: {type: integer, minimum: 1, maximum: 2147483647}
        languageCode: {type: string, enum: [zh-CN, ko-KR]}
        sourceText: {type: string, maxLength: 1500, description: Exact source of up to 1500 UTF-16 units.}
        voiceId: {type: [string, 'null']}
        speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
        audioStatus: {type: string, enum: [NOT_GENERATED, PENDING, PROCESSING, READY, FAILED, OUTDATED]}
        audioGenerationId: {type: [string, 'null'], format: uuid}
        audioAssetId: {type: [string, 'null'], format: uuid}
        errorCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, requestId]
          additionalProperties: false
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string, minLength: 1}
            details:
              type: object
              properties:
                currentVersion: {type: integer, minimum: 1}
                existingId: {type: string, format: uuid}
                fields:
                  type: array
                  items:
                    type: object
                    required: [path, code, message]
                    properties:
                      path: {type: string}
                      code: {type: string}
                      message: {type: string}
    LanguageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearningLanguage'
    LearningLanguage:
      type: object
      additionalProperties: false
      required: [code, displayName]
      properties:
        code:
          type: string
          enum: [zh-CN, ko-KR]
        displayName:
          type: string
          minLength: 1
    TTSVoiceList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TTSVoice'
    TTSVoice:
      type: object
      required: [voiceId, displayName, languageCode, providerId, speakingRates]
      additionalProperties: false
      properties:
        voiceId: {type: string, minLength: 1}
        displayName: {type: string, minLength: 1}
        languageCode: {type: string, enum: [zh-CN, ko-KR]}
        providerId: {type: string, enum: [azure, mock]}
        speakingRates:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: number, exclusiveMinimum: 0}
    PreviewInput:
      type: object
      additionalProperties: false
      required: [languageCode, sourceText, voiceId, speakingRate]
      properties:
        languageCode: {type: string, enum: [zh-CN, ko-KR]}
        sourceText:
          type: string
          minLength: 1
          maxLength: 1500
          description: Exact speech source of up to 1500 UTF-16 units.
        voiceId: {type: string}
        speakingRate: {type: number, enum: [0.75, 1, 1.25]}
    PreviewStatus:
      type: object
      additionalProperties: false
      required: [generationId, status, expiresAt, sourceFingerprint, audioAssetId, errorCode]
      properties:
        generationId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, PROCESSING, READY, FAILED]}
        expiresAt: {type: string, format: date-time}
        sourceFingerprint: {type: string}
        audioAssetId: {type: [string, 'null'], format: uuid}
        errorCode: {type: [string, 'null']}
    ItemCreate:
      type: object
      additionalProperties: false
      required: [languageCode]
      properties:
        previewGenerationId:
          type: string
          format: uuid
          description: Claim this owned, unexpired READY preview with exactly matching synthesis inputs.
        languageCode: {type: string, enum: [zh-CN, ko-KR]}
        title: {type: [string, 'null'], maxLength: 120}
        sourceText:
          type: string
          maxLength: 1500
          description: Exact source of up to 1500 UTF-16 units.
        description: {type: [string, 'null'], maxLength: 1000}
        notes: {type: [string, 'null'], maxLength: 5000}
        coverImageId: {type: [string, 'null'], format: uuid}
        difficulty: {type: [string, 'null'], enum: [beginner, intermediate, advanced, null]}
        isFavorite: {type: boolean}
        voiceId: {type: [string, 'null']}
        speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
        topicIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    DirectPublication:
      allOf:
        - $ref: '#/components/schemas/ItemCreate'
        - type: object
          required: [title, sourceText, previewGenerationId]
          properties:
            previewGenerationId: {type: string, format: uuid}
            title: {type: string, minLength: 1, pattern: '\S'}
            sourceText: {type: string, minLength: 1, pattern: '\S'}
    ItemPatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        previewGenerationId:
          type: string
          format: uuid
          description: Claim this owned, unexpired READY preview against the draft inputs after applying the patch.
        expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
        title: {type: [string, 'null'], maxLength: 120}
        sourceText:
          type: string
          maxLength: 1500
          description: Exact source of up to 1500 UTF-16 units.
        description: {type: [string, 'null'], maxLength: 1000}
        notes: {type: [string, 'null'], maxLength: 5000}
        coverImageId: {type: [string, 'null'], format: uuid}
        difficulty: {type: [string, 'null'], enum: [beginner, intermediate, advanced, null]}
        voiceId: {type: [string, 'null']}
        speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
        topicIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    Item:
      type: object
      additionalProperties: false
      required: [id, languageCode, title, sourceText, description, notes, difficulty, isFavorite, voiceId, speakingRate, topicIds, status, publishedAt, version, createdAt, updatedAt, audioStatus, audioAssetId, audioGenerationId]
      properties:
        id: {type: string, format: uuid}
        languageCode: {type: string, enum: [zh-CN, ko-KR]}
        automaticVocabularyMatching:
          type: boolean
          description: A verified automatic vocabulary matcher is enabled for this published item.
        coverImageId: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [draft, published]}
        version: {type: integer, minimum: 1}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        audioStatus: {type: string, enum: [NOT_GENERATED, PENDING, PROCESSING, READY, FAILED, OUTDATED]}
        audioAssetId: {type: [string, 'null'], format: uuid}
        audioGenerationId:
          type: [string, 'null']
          format: uuid
          description: Latest saved-draft generation, including claimed previews. Null when no draft generation exists.
        transcript:
          description: Stored timing for the active recording, present on published item detail when available.
          $ref: '#/components/schemas/Transcript'
        title: {type: [string, 'null'], maxLength: 120}
        sourceText:
          type: string
          maxLength: 1500
          description: Exact source of up to 1500 UTF-16 units.
        description: {type: [string, 'null'], maxLength: 1000}
        notes: {type: [string, 'null'], maxLength: 5000}
        difficulty: {type: [string, 'null'], enum: [beginner, intermediate, advanced, null]}
        isFavorite: {type: boolean}
        voiceId: {type: [string, 'null']}
        speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
        topicIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    Transcript:
      type: object
      additionalProperties: false
      required: [durationMs, segments]
      properties:
        durationMs: {type: integer, minimum: 1}
        segments:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [index, textStart, textEnd, text, startMs, endMs]
            properties:
              index: {type: integer, minimum: 0}
              textStart: {type: integer, minimum: 0, description: Inclusive UTF-16 offset.}
              textEnd: {type: integer, minimum: 1, description: Exclusive UTF-16 offset.}
              text: {type: string, minLength: 1}
              startMs: {type: integer, minimum: 0}
              endMs: {type: integer, minimum: 1}
    ItemPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 50}
    TopicCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        colorPreset:
          allOf:
            - $ref: '#/components/schemas/TopicPreset'
          default: iris
    TopicPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        colorPreset:
          $ref: '#/components/schemas/TopicPreset'
    TopicPreset:
      type: string
      enum: [iris, periwinkle, orchid, sage, amber, slate]
    TopicList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
    Topic:
      type: object
      additionalProperties: false
      required: [id, name, isDefault, systemKey, colors, usageCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        usageCount: {type: integer, minimum: 0}
        vocabularyUsageCount: {type: integer, minimum: 0}
        isDefault:
          type: boolean
        systemKey:
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]*$'
        colors:
          type: object
          additionalProperties: false
          required: [light, dark]
          properties:
            light:
              $ref: '#/components/schemas/ThemeColors'
            dark:
              $ref: '#/components/schemas/ThemeColors'
    ThemeColors:
      type: object
      additionalProperties: false
      required: [background, text]
      properties:
        background:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        text:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
