          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string, minLength: 1}
            details:
              type: object
              properties:
                currentVersion: {type: integer, minimum: 1}
                existingId: {type: string, format: uuid}
                fields:
                  type: array
                  items:
                    type: object
                    required: [path, code, message]
                    properties:
                      path: {type: string}
                      code: {type: string}
                      message: {type: string}
    LanguageList:
      type: object
