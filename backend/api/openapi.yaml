        previewGenerationId:
          type: string
          format: uuid
          description: Claim this owned, unexpired READY preview with exactly matching synthesis inputs.
        languageCode: {type: string, enum: [zh-CN, ko-KR]}
        title: {type: [string, 'null'], maxLength: 120}
        sourceText:
          type: string
          maxLength: 1500
          description: Exact source of up to 1500 UTF-16 units.
        description: {type: [string, 'null'], maxLength: 1000}
        notes: {type: [string, 'null'], maxLength: 5000}
        difficulty: {type: [string, 'null'], enum: [beginner, intermediate, advanced, null]}
        isFavorite: {type: boolean}
        voiceId: {type: [string, 'null']}
        speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
        topicIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    ItemPatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        previewGenerationId:
          type: string
          format: uuid
          description: Claim this owned, unexpired READY preview against the draft inputs after applying the patch.
        expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
        title: {type: [string, 'null'], maxLength: 120}
        sourceText:
          type: string
          maxLength: 1500
          description: Exact source of up to 1500 UTF-16 units.
        description: {type: [string, 'null'], maxLength: 1000}
        notes: {type: [string, 'null'], maxLength: 5000}
        difficulty: {type: [string, 'null'], enum: [beginner, intermediate, advanced, null]}
        isFavorite: {type: boolean}
        voiceId: {type: [string, 'null']}
        speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
        topicIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    Item:
      type: object
      additionalProperties: false
      required: [id, languageCode, title, sourceText, description, notes, difficulty, isFavorite, voiceId, speakingRate, topicIds, status, publishedAt, version, createdAt, updatedAt, audioStatus, audioAssetId, audioGenerationId]
      properties:
        id: {type: string, format: uuid}
        languageCode: {type: string, enum: [zh-CN, ko-KR]}
        status: {type: string, enum: [draft, published]}
        version: {type: integer, minimum: 1}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        audioStatus: {type: string, enum: [NOT_GENERATED, PENDING, PROCESSING, READY, FAILED, OUTDATED]}
        audioAssetId: {type: [string, 'null'], format: uuid}
        audioGenerationId:
          type: [string, 'null']
          format: uuid
          description: Latest saved-draft generation, including claimed previews. Null when no draft generation exists.
        title: {type: [string, 'null'], maxLength: 120}
        sourceText:
          type: string
          maxLength: 1500
          description: Exact source of up to 1500 UTF-16 units.
        description: {type: [string, 'null'], maxLength: 1000}
        notes: {type: [string, 'null'], maxLength: 5000}
        difficulty: {type: [string, 'null'], enum: [beginner, intermediate, advanced, null]}
        isFavorite: {type: boolean}
        voiceId: {type: [string, 'null']}
        speakingRate: {type: [number, 'null'], enum: [0.75, 1, 1.25, null]}
        topicIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    ItemPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 50}
    TopicCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        colorPreset:
          allOf:
            - $ref: '#/components/schemas/TopicPreset'
          default: iris
    TopicPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        colorPreset:
          $ref: '#/components/schemas/TopicPreset'
    TopicPreset:
      type: string
      enum: [iris, periwinkle, orchid, sage, amber, slate]
    TopicList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
    Topic:
      type: object
      additionalProperties: false
      required: [id, name, isDefault, systemKey, colors, usageCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        usageCount: {type: integer, minimum: 0}
        isDefault:
          type: boolean
        systemKey:
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]*$'
        colors:
          type: object
          additionalProperties: false
          required: [light, dark]
          properties:
            light:
              $ref: '#/components/schemas/ThemeColors'
            dark:
              $ref: '#/components/schemas/ThemeColors'
    ThemeColors:
      type: object
      additionalProperties: false
      required: [background, text]
      properties:
        background:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        text:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
