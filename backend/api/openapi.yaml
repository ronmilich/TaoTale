openapi: 3.1.0
info:
  title: TaoTale backend
  version: 0.1.0
  description: Loopback-only JSON API for the local TaoTale application.
servers:
  - url: /api/v1
paths:
  /health/live:
    servers:
      - url: /api/v1
      - url: /
    get:
      operationId: healthLive
      summary: Check whether the API process is running
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
  /health/ready:
    servers:
      - url: /api/v1
      - url: /
    get:
      operationId: healthReady
      summary: Check whether the API can use its local storage
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          description: PostgreSQL is unreachable, its migration history is incompatible, or the media directory is unwritable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Backend storage unavailable.
                  requestId: example-request-id
  /languages:
    get:
      operationId: listLanguages
      summary: List enabled learning languages
      responses:
        '200':
          description: Enabled, supported languages in locale-code order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageList'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items:
    get:
      operationId: listItems
      summary: List the owner's items for one learning language
      parameters:
        - $ref: '#/components/parameters/ItemLanguage'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 2147483647, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 8}
      responses:
        '200':
          $ref: '#/components/responses/ItemPage'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
    post:
      operationId: createItem
      summary: Save a new draft and optionally claim a matching preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          $ref: '#/components/responses/Item'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getItem
      summary: Read a saved item
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
    patch:
      operationId: patchItem
      summary: Update an item at the expected version and optionally claim a matching preview for a draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
    delete:
      operationId: deleteItem
      summary: Delete an owned item and its topic associations
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/AudioAssetPin'
    get:
      operationId: streamItemAudio
      summary: Stream the requested current item recording
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioStream'
        '206':
          $ref: '#/components/responses/PartialAudioStream'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio/download:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/AudioAssetPin'
    get:
      operationId: downloadItemAudio
      summary: Download the requested current item recording
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioDownload'
        '206':
          $ref: '#/components/responses/PartialAudioDownload'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /tts/previews:
    post:
      operationId: createTTSPreview
      summary: Admit a temporary speech preview
      description: The exact synthesis inputs are snapshotted for 24 hours. The same key and inputs replay the original receipt. Expired keys remain reserved.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewInput'
      responses:
        '202':
          description: Durable preview generation receipt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [generationId]
                properties:
                  generationId: {type: string, format: uuid}
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /tts/previews/{generationId}:
    parameters:
      - $ref: '#/components/parameters/PreviewId'
    get:
      operationId: getTTSPreview
      summary: Read the status of an unclaimed temporary preview
      responses:
        '200':
          description: Preview status and playable asset identity when ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewStatus'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/MissingPreview'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /tts/previews/{generationId}/audio:
    parameters:
      - $ref: '#/components/parameters/PreviewId'
    get:
      operationId: streamTTSPreview
      summary: Stream an unclaimed ready preview
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioStream'
        '206':
          $ref: '#/components/responses/PartialAudioStream'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/MissingPreview'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /tts/previews/{generationId}/audio/download:
    parameters:
      - $ref: '#/components/parameters/PreviewId'
    get:
      operationId: downloadTTSPreview
      summary: Download an unclaimed ready preview
      parameters:
        - $ref: '#/components/parameters/AudioRange'
      responses:
        '200':
          $ref: '#/components/responses/AudioDownload'
        '206':
          $ref: '#/components/responses/PartialAudioDownload'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/MissingPreview'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '416':
          $ref: '#/components/responses/InvalidAudioRange'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio/generate:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: generateDraftAudio
      summary: Admit one generation of the saved draft
      description: A retry with the same key and body returns the original generation for 24 hours, including after edits. An expected version protects new requests from concurrent edits. Expired keys remain reserved. A different active job on this draft conflicts.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedVersion: {type: integer, minimum: 1, maximum: 2147483647}
      responses:
        '202':
          description: Durable generation receipt, identical on replay.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [generationId]
                additionalProperties: false
                properties:
                  generationId: {type: string, format: uuid}
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '429':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /items/{itemId}/audio/generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: generationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getDraftGeneration
      summary: Read a saved generation and its current eligibility for this draft
      responses:
        '200':
          description: Generation status projected against the current saved synthesis inputs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [generationId, itemId, status, jobStatus, sourceFingerprint, audioAssetId, errorCode]
                additionalProperties: false
                properties:
                  generationId: {type: string, format: uuid}
                  itemId: {type: string, format: uuid}
                  status: {type: string, enum: [PENDING, PROCESSING, READY, FAILED, OUTDATED]}
                  jobStatus:
                    description: Persisted job lifecycle for polling. Use status and audioAssetId for playback eligibility.
                    type: string
                    enum: [PENDING, PROCESSING, READY, FAILED]
                  sourceFingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
                  audioAssetId: {type: [string, 'null'], format: uuid}
                  errorCode: {type: [string, 'null']}
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /topics:
    get:
      operationId: listTopics
      summary: List the local owner's Topics
      responses:
        '200':
          description: Shared Topics in normalized name order, with ID as the tie-breaker.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
    post:
      operationId: createTopic
      summary: Create a Topic shared across the owner's learning languages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreate'
      responses:
        '201':
          $ref: '#/components/responses/Topic'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
  /topics/{topicId}:
    parameters:
      - name: topicId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: patchTopic
      summary: Rename or recolor an owned Topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicPatch'
      responses:
        '200':
          $ref: '#/components/responses/Topic'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '415':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
        '504':
          $ref: '#/components/responses/APIError'
    delete:
      operationId: deleteTopic
      summary: Delete a custom Topic and its associations
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '403':
          $ref: '#/components/responses/APIError'
        '404':
          $ref: '#/components/responses/APIError'
        '409':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          $ref: '#/components/responses/APIError'
  /tts/voices:
    get:
      operationId: listTTSVoices
      summary: List available speech voices for a learning language
      parameters:
        - name: languageCode
          in: query
          required: true
          schema:
            type: string
            enum: [zh-CN, ko-KR]
      responses:
        '200':
          description: Verified voices and supported rates for the selected language.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSVoiceList'
        '400':
          $ref: '#/components/responses/APIError'
        '403':
          $ref: '#/components/responses/APIError'
        '413':
          $ref: '#/components/responses/APIError'
        '500':
          $ref: '#/components/responses/APIError'
        '503':
          description: The speech provider is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: TTS_UNAVAILABLE
                  message: Speech synthesis is unavailable.
                  requestId: example-request-id
components:
  parameters:
    AudioAssetPin:
      name: audioAssetId
      in: query
      required: true
      description: Expected asset identity. A stale or unknown recording returns 404.
      schema: {type: string, format: uuid}
    PreviewId:
      name: generationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AudioRange:
      name: Range
      in: header
      description: A single byte range, including open-ended and suffix ranges.
      schema: {type: string}
    ItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemLanguage:
      name: languageCode
      in: query
      required: true
      schema: {type: string, enum: [zh-CN, ko-KR]}
  headers:
    AcceptAudioRanges:
      schema: {type: string, const: bytes}
    PrivateAudioCache:
      schema: {type: string, enum: ['private, no-cache', 'private, no-store']}
    AudioContentRange:
      schema: {type: string}
    RequestId:
      description: Server-generated identifier for this request.
      required: true
      schema:
        type: string
  responses:
    AudioStream:
      description: Full verified MP3.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    AudioDownload:
      description: Full verified MP3 served as an attachment.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
        Content-Disposition:
          description: Attachment with a server-generated MP3 filename.
          schema: {type: string}
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    PartialAudioStream:
      description: One satisfiable byte range.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
        Content-Range:
          $ref: '#/components/headers/AudioContentRange'
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    PartialAudioDownload:
      description: One satisfiable byte range served as an attachment.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateAudioCache'
        Content-Length:
          schema: {type: integer, minimum: 1}
        Content-Range:
          $ref: '#/components/headers/AudioContentRange'
        Content-Disposition:
          description: Attachment with a server-generated MP3 filename.
          schema: {type: string}
      content:
        audio/mpeg:
          schema: {type: string, format: binary}
    InvalidAudioRange:
      description: INVALID_RANGE for a malformed, multiple or unsatisfiable byte range.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptAudioRanges'
        Content-Range:
          $ref: '#/components/headers/AudioContentRange'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MissingPreview:
      description: PREVIEW_NOT_FOUND for an unknown, expired or already claimed preview.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Item:
      description: Saved Library item.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'
    ItemPage:
      description: A page of matching Library items.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ItemPage'
    Topic:
      description: Saved Topic and its item usage count.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Topic'
    Deleted:
      description: The resource was deleted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Healthy:
      description: The health check passed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            required: [status]
            additionalProperties: false
            properties:
              status: {const: ok}
    APIError:
      description: A sanitized HTTP error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, requestId]
